<!DOCTYPE html>
<html lang="ko">

<head>
    <!-- @include partials/head.html title="{{code}} {{title}} | YuruVerse" description="YuruVerse 오류 페이지야. 뭔가 터졌거나 오면 안 되는 데 온 거야." image="{{image}}" path="{{path}}" locale="ko_KR" altlocale="en_US" font="PretendardVariable.woff2" -->
    <meta name="robots" content="noindex">
</head>

<body>
    <!-- @include partials/ko/nav.html path="{{path}}" -->

    <main class="relative flex grow items-center justify-center overflow-hidden px-4 py-16 sm:px-6">
        <div class="glow top-10 left-1/2 size-[26rem] -translate-x-1/2 {{glow}}" aria-hidden="true"></div>

        <div class="card relative w-full max-w-2xl p-8 text-center sm:p-10">
            <p class="font-mono text-6xl font-bold tracking-tight {{tint}}">{{code}}</p>
            <h1 class="mt-2 text-2xl font-bold text-ink">{{title}}</h1>
            <img src="{{image}}" alt="{{imagealt}}"
                 class="mx-auto mt-6 max-h-64 w-auto rounded-2xl border border-line">
            <p class="mt-2 text-xs text-faint">{{caption}}</p>
            <p class="mt-6 text-sm/relaxed">{{message}}</p>
            <div class="mt-8 flex flex-col justify-center gap-3 sm:flex-row sm:flex-wrap">
                <a href="{{homehref}}" class="btn-primary whitespace-nowrap">
                    <svg class="size-4" aria-hidden="true"><use href="#i-{{homeicon}}"/></svg>
                    {{homelabel}}
                </a>
                <a href="/ko/#services" class="btn-ghost whitespace-nowrap">
                    <svg class="size-4" aria-hidden="true"><use href="#i-globe"/></svg>
                    그래도 서비스 목록은 보여줘
                </a>
            </div>
        </div>
    </main>

    <!-- @include partials/ko/footer.html -->
</body>

</html>
